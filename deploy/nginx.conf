server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A hangfájlokhoz a böngésző bájttartományt kér (Safari e nélkül el sem indul).
    add_header Accept-Ranges bytes;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # A fájlnevek nem verziózottak, ezért a médiát és a betűket a
    # service worker tárolja hosszú távon, a böngésző csak egy napig.
    location ~* \.(jpg|png|m4a|woff2|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # Az app kódja és az adatok frissüljenek azonnal a telepítés után.
    location ~* \.(html|js|css|json|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
