server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A hangfájlokhoz a böngésző bájttartományt kér (Safari e nélkül el sem
    # indul); az Accept-Ranges fejlécet és a 206-ot az nginx magától adja.

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # A média neve a tartalom hash-ét hordozza (tengelic-1.3fa9c2d1.jpg):
    # egy név alatt sosem változik, tehát a böngésző örökre tárolhatja.
    # (A kapcsos zárójel miatt a regex idézőjelben áll, különben az nginx el
    # sem indul.)
    location ~* "\.[0-9a-f]{8}\.(jpg|m4a)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Az ikonok és a betűk neve nem verziózott: a böngésző csak egy napig
    # tartja őket, hosszú távon a service worker.
    location ~* \.(jpg|png|m4a|woff2|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Az app kódja és az adatok frissüljenek azonnal a telepítés után.
    location ~* \.(html|js|css|json|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
